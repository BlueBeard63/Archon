[package]
name = "archon-client"
version = "0.1.0"
edition = "2021"
description = "Archon GUI client - site deployment management"

[[bin]]
name = "archon"
path = "src/main.rs"

[dependencies]
# GUI framework
floem = "0.2.0"

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# WebSocket
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Crypto
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", features = ["simple"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"

# URL parsing
url = "2"

# Regex (legacy TOML datetime fixup)
regex = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Platform directories
dirs = "6"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"
